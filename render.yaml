services:
  # ── Backend: Node/Express API ─────────────────────────────────────────────
  - type: web
    name: tokyo-mart-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd server && npx prisma db push && node prisma/seed.js && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        sync: false                   # ← Set in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false                   # ← Set in Render Dashboard
      - key: CLIENT_URL
        sync: false                   # ← Set after frontend deploys

  # ── Frontend: React/Vite Static Site ─────────────────────────────────────
  - type: web
    name: tokyo-mart-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tokyo-mart-backend
          property: host
